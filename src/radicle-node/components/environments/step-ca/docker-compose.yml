services:
  radicle-node:
    environment:
      VIRTUAL_HOST_MULTIPORTS: |-
        ${P2P_VIRTUAL_HOST}:
          "/":
            port: ${P2P_VIRTUAL_PORT}
        ${API_VIRTUAL_HOST}:
          "/":
            port: ${API_VIRTUAL_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - step-ca-network

networks:
  step-ca-network:
    external: true
